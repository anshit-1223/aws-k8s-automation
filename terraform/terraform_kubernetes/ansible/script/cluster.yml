#Date - 11-Oct-2026
#Description - Create Cluster and Join Worker Nodes
---
- name: Create Cluster and Join Worker Nodes
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Get Hostname
      command: hostname
      register: host_name
      changed_when: false

    - name: Print Hostname
      debug:
        var: host_name.stdout

    - name: Initialize the Cluster
      command: sudo kubeadm init
      become_user: ubuntu
      when: host_name.stdout == "master-node"

    - name: Create config on home directory
      script: cp.sh
      become_user: ubuntu
      when: host_name.stdout == "master-node"

    - name: Enable Pod Networking
      command: "kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.26.0/manifests/calico.yaml"
      become_user: ubuntu
      when: host_name.stdout == "master-node"



    - name: Print Join Command 
      command: kubeadm token create --print-join-command
      register: clusterjoin
      become_user: ubuntu
      when: host_name.stdout == "master-node"
 
    - name: Join Worker Node to Cluster
      command: "{{ hostvars['k8s-control']['clusterjoin']['stdout'] }}"
      become: true
      when: host_name.stdout != "master-node"